<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eren Kuyumculuk | QR Oluştur</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Manrope:wght@300;500;700&display=swap');

    :root {
      --bg: #0c0a07;
      --panel: rgba(18, 14, 10, 0.75);
      --gold: #f0d48a;
      --gold-deep: #caa657;
      --text: #f7f3ea;
      --muted: #c5b9a6;
      --shadow: rgba(0, 0, 0, 0.5);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      font-family: 'Manrope', sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 12% 12%, rgba(240, 212, 138, 0.16), transparent 35%),
        radial-gradient(circle at 80% 18%, rgba(202, 166, 87, 0.18), transparent 32%),
        linear-gradient(150deg, #0b0906 20%, #13100b 60%, #090806 100%);
      padding: 28px 16px 48px;
    }

    .noise {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(transparent, transparent),
        url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/></filter><rect width="120" height="120" filter="url(%23n)" opacity="0.035"/></svg>');
      pointer-events: none;
      opacity: 0.6;
    }

    main {
      max-width: 980px;
      margin: 0 auto;
      position: relative;
      z-index: 2;
      display: grid;
      gap: 24px;
    }

    header {
      display: flex;
      flex-direction: column;
      gap: 10px;
      text-align: center;
    }

    header h1 {
      font-family: 'Cinzel', serif;
      font-size: clamp(2rem, 3vw, 3rem);
      letter-spacing: 0.08em;
      color: var(--gold);
    }

    header p {
      color: var(--muted);
      font-size: 0.98rem;
    }

    .panel {
      background: var(--panel);
      border: 1px solid rgba(240, 212, 138, 0.2);
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 14px 40px var(--shadow);
      backdrop-filter: blur(10px);
    }

    .grid {
      display: grid;
      gap: 24px;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      align-items: center;
    }

    .input-block label {
      display: block;
      font-size: 0.9rem;
      color: var(--muted);
      margin-bottom: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .input-row {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .input-row input {
      height: 52px;
      padding: 0 16px;
      border-radius: 12px;
      border: 1px solid rgba(240, 212, 138, 0.35);
      background: rgba(10, 8, 6, 0.9);
      color: var(--text);
      font-size: 0.98rem;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .input-row input:focus {
      border-color: rgba(240, 212, 138, 0.7);
      box-shadow: 0 0 0 3px rgba(240, 212, 138, 0.15);
    }

    .input-row button {
      height: 50px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(140deg, var(--gold), var(--gold-deep));
      color: #2a1d0a;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .input-row button:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 20px rgba(240, 212, 138, 0.25);
    }

    .hint {
      margin-top: 12px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .qr-stage {
      display: grid;
      place-items: center;
      gap: 14px;
    }

    .qr-frame {
      position: relative;
      padding: 18px;
      border-radius: 20px;
      background: radial-gradient(circle at top, rgba(255, 255, 255, 0.18), rgba(255, 255, 255, 0.05));
      border: 2px solid rgba(240, 212, 138, 0.45);
      box-shadow: 0 0 24px rgba(240, 212, 138, 0.2);
    }

    #qr-code {
      width: 240px;
      height: 240px;
      display: grid;
      place-items: center;
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
    }

    .qr-logo {
      position: absolute;
      width: 64px;
      height: 64px;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: #fff;
      border-radius: 50%;
      padding: 10px;
      border: 2px solid rgba(202, 166, 87, 0.8);
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.25);
      display: grid;
      place-items: center;
    }

    .qr-logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .scan-text {
      font-family: 'Cinzel', serif;
      font-size: 1.2rem;
      letter-spacing: 0.18em;
      color: var(--gold);
    }

    .message {
      font-size: 0.92rem;
      color: var(--muted);
      min-height: 20px;
      text-align: center;
    }

    .qr-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin-top: 6px;
    }

    .qr-actions a {
      height: 44px;
      padding: 0 18px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(140deg, var(--gold), var(--gold-deep));
      color: #2a1d0a;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-decoration: none;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .qr-actions a:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 20px rgba(240, 212, 138, 0.25);
    }

    footer {
      text-align: center;
      font-size: 0.85rem;
      color: var(--muted);
    }

    @media (max-width: 720px) {
      body { padding: 22px 12px 36px; }
      .panel { padding: 20px; }
      #qr-code { width: 210px; height: 210px; }
    }
  </style>
</head>
<body>
  <div class="noise"></div>

  <main>
    <header>
      <h1>QR Oluştur</h1>
      <p>Linki girin, özel tasarımlı QR kodunuzu anında üretelim.</p>
    </header>

    <section class="panel grid">
      <div class="input-block">
        <label for="qr-input">Bağlantı</label>
        <div class="input-row">
          <input id="qr-input" type="url" placeholder="https://erenkuyumculuk.com.tr" autocomplete="off">
          <button id="qr-generate" type="button">QR Oluştur</button>
        </div>
        <div class="hint">Logo merkezde, yüksek düzey hata düzeltme ile güvenli tarama.</div>
      </div>

      <div class="qr-stage">
        <div class="qr-frame">
          <div id="qr-code"></div>
          <div class="qr-logo" aria-hidden="true">
            <img src="logo.svg" alt="Eren Kuyumculuk Logo">
          </div>
        </div>
        <div class="scan-text">Beni Tara</div>
        <div class="message" id="qr-message"></div>
        <div class="qr-actions">
          <a id="qr-download" href="#" download="eren-kuyumculuk-qr.png">QR Indir</a>
        </div>
      </div>
    </section>

    <footer>
      Eren Kuyumculuk • QR Stüdyosu
    </footer>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script>
    const input = document.getElementById('qr-input');
    const button = document.getElementById('qr-generate');
    const qrContainer = document.getElementById('qr-code');
    const message = document.getElementById('qr-message');
    const qrDownload = document.getElementById('qr-download');

    const logoImage = new Image();
    logoImage.src = 'logo.svg';

    const roundedRect = (ctx, x, y, width, height, radius) => {
      const r = Math.min(radius, width / 2, height / 2);
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + width, y, x + width, y + height, r);
      ctx.arcTo(x + width, y + height, x, y + height, r);
      ctx.arcTo(x, y + height, x, y, r);
      ctx.arcTo(x, y, x + width, y, r);
      ctx.closePath();
    };

    const createQr = (value) => {
      qrContainer.innerHTML = '';
      new QRCode(qrContainer, {
        text: value,
        width: 220,
        height: 220,
        colorDark: '#0e0b08',
        colorLight: '#ffffff',
        correctLevel: QRCode.CorrectLevel.H
      });
      requestAnimationFrame(updateDownloadLink);
    };

    const buildExportCanvas = (qrCanvas) => {
      const size = 700;
      const textArea = 80;
      const margin = 32;
      const frameSize = size - margin * 2 - textArea;
      const frameX = margin;
      const frameY = margin;
      const frameBottom = frameY + frameSize;

      const exportCanvas = document.createElement('canvas');
      exportCanvas.width = size;
      exportCanvas.height = size;
      const ctx = exportCanvas.getContext('2d');

      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, size, size);

      roundedRect(ctx, frameX, frameY, frameSize, frameSize, 36);
      ctx.fillStyle = '#ffffff';
      ctx.fill();
      ctx.lineWidth = 4;
      ctx.strokeStyle = '#d6c08a';
      ctx.stroke();

      const qrBackSize = frameSize - 70;
      const qrBackX = frameX + (frameSize - qrBackSize) / 2;
      const qrBackY = frameY + (frameSize - qrBackSize) / 2;
      roundedRect(ctx, qrBackX, qrBackY, qrBackSize, qrBackSize, 28);
      ctx.fillStyle = '#ffffff';
      ctx.fill();

      if (qrCanvas) {
        const qrSize = qrBackSize - 36;
        const qrX = qrBackX + (qrBackSize - qrSize) / 2;
        const qrY = qrBackY + (qrBackSize - qrSize) / 2;
        ctx.imageSmoothingEnabled = false;
        ctx.drawImage(qrCanvas, qrX, qrY, qrSize, qrSize);
      }

      const centerX = frameX + frameSize / 2;
      const centerY = frameY + frameSize / 2;
      const logoRadius = 46;
      ctx.beginPath();
      ctx.arc(centerX, centerY, logoRadius, 0, Math.PI * 2);
      ctx.fillStyle = '#ffffff';
      ctx.fill();
      ctx.lineWidth = 5;
      ctx.strokeStyle = '#caa657';
      ctx.stroke();

      if (logoImage.complete && logoImage.naturalWidth) {
        const logoSize = logoRadius * 1.2;
        ctx.drawImage(logoImage, centerX - logoSize / 2, centerY - logoSize / 2, logoSize, logoSize);
      }

      ctx.fillStyle = '#b89c62';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = '600 32px "Cinzel", serif';
      ctx.fillText('BENI TARA', size / 2, frameBottom + textArea * 0.55);

      return exportCanvas;
    };

    const updateDownloadLink = () => {
      const qrCanvas = qrContainer.querySelector('canvas');
      if (!qrCanvas) return;
      const exportCanvas = buildExportCanvas(qrCanvas);
      qrDownload.href = exportCanvas.toDataURL('image/png');
    };

    const normalizeUrl = (value) => {
      if (!value) return '';
      const hasProtocol = /^https?:\/\//i.test(value);
      return hasProtocol ? value : `${value}`;
    };

    button.addEventListener('click', () => {
      const rawValue = input.value.trim();
      if (!rawValue) {
        message.textContent = 'Lutfen bir link girin.';
        return;
      }
      const finalValue = normalizeUrl(rawValue);
      createQr(finalValue);
      message.textContent = `Hazir: ${finalValue}`;
    });

    input.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') {
        button.click();
      }
    });

    createQr('https://erenkuyumculuk.com.tr');
    logoImage.addEventListener('load', updateDownloadLink);
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(updateDownloadLink);
    }
  </script>
</body>
</html>
